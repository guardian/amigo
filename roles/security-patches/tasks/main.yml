## Automatically disable Log4J2 vulnerability CVE-2021-44228 and CVE-2021-45046

- name: Create /usr/local/log4j-hotpatch directory
  file:
    path: /usr/local/log4j-hotpatch
    state: directory

- name: Copy log4j-hotpatch jar
  copy:
    src: Log4jHotPatch.jar
    dest: /usr/local/log4j-hotpatch/Log4jHotPatch.jar
    mode: u+x

- name: Create systemd conf directory for log4j hotpatch environment
  file:
    path: /etc/systemd/system.conf.d
    state: directory

- name: Set systemd environment for log4j hotpatch
  copy:
    src: log4j-systemd.conf
    dest: /etc/systemd/system.conf.d/99-log4j-hotpatch.conf

- name: Set log4j hotpatch environment outside systemd
  lineinfile:
    path: /etc/environment
    create: yes
    insertafter: EOF
    line: JAVA_TOOL_OPTIONS=-javaagent:/usr/local/log4j-hotpatch/Log4jHotPatch.jar=log4jFixerVerbose=false


## CVE-2026-98432 nftables mitigation

- name: Install nftables
  apt:
    name: nftables
    state: present
    update_cache: yes

- name: Create /etc/nftables.d directory
  file:
    path: /etc/nftables.d
    state: directory
    mode: "0755"

- name: Copy CVE-2026-98432 nftables rules
  copy:
    src: cve-2026-98432.nft
    dest: /etc/nftables.d/cve-2026-98432.nft
    mode: "0644"

# Fails the role if the rules are invalid; runs before the include is added
- name: Check nft accepts CVE-2026-98432 rules
  command: nft -c -f /etc/nftables.d/cve-2026-98432.nft
  changed_when: false

- name: Include CVE-2026-98432 rules in nftables.conf
  lineinfile:
    path: /etc/nftables.conf
    insertafter: EOF
    line: include "/etc/nftables.d/cve-2026-98432.nft"

- name: Ensure nftables.service is enabled
  systemd:
    name: nftables.service
    enabled: yes
