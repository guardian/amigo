---
- name: Install repository prerequisites
  apt:
    name:
      - ca-certificates
      - gnupg
      - python3-apt
    update_cache: yes

- name: Add GPG key
  get_url:
    url: https://packages.fluentbit.io/fluentbit.key
    dest: /usr/share/keyrings/fluentbit-keyring.asc
    mode: '0644'

- name: Remove the repository entry that used the global apt keyring
  ansible.builtin.apt_repository:
    repo: deb https://packages.fluentbit.io/ubuntu/{{ ubuntu_version }} {{ ubuntu_version }} main
    state: absent
    update_cache: no

- name: Add repository
  ansible.builtin.apt_repository:
    repo: deb [signed-by=/usr/share/keyrings/fluentbit-keyring.asc] https://packages.fluentbit.io/ubuntu/{{ ubuntu_version }} {{ ubuntu_version }} main

- name: Install
  apt:
    name: "{{ fluentbit_package }}{{ '' if version in ['newest', 'latest'] else '=' ~ version }}"
    state: "{{ 'latest' if version in ['newest', 'latest'] else 'present' }}"
    update_cache: yes
