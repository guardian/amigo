---
- name: Validate Fluent Bit package name
  assert:
    that:
      - fluentbit_package in ['td-agent-bit', 'fluent-bit']
    fail_msg: "fluentbit_package must be either 'td-agent-bit' or 'fluent-bit'."

- name: Add repository
  ansible.builtin.deb822_repository:
    name: fluentbit
    types: deb
    uris: "https://packages.fluentbit.io/ubuntu/{{ ubuntu_version }}"
    suites: "{{ ubuntu_version }}"
    components: main
    signed_by: https://packages.fluentbit.io/fluentbit.key
    state: present

- name: Install
  apt:
    name: "{{ fluentbit_package }}{{ '' if version in ['newest', 'latest'] else '=' ~ version }}"
    state: "{{ 'latest' if version in ['newest', 'latest'] else 'present' }}"
    update_cache: yes
