---
- name: Add Elastic repository
  ansible.builtin.deb822_repository:
    name: elastic
    types: deb
    uris: "https://artifacts.elastic.co/packages/{{ version.split('.')[0] }}.x/apt"
    suites: stable
    components: main
    signed_by: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    state: present

- name: Ensure Kibana is installed
  apt:
    name: "kibana={{ version }}"
    update_cache: true
    state: present
