---
- name: Add neo4j repository
  ansible.builtin.deb822_repository:
    name: neo4j
    types: deb
    uris: https://debian.neo4j.com
    suites: stable
    components: "{{ neo4j_repo_version }}"
    signed_by: https://debian.neo4j.com/neotechnology.gpg.key
    state: present

- name: Install neo4j
  apt:
    name: neo4j={{ neo4j_version}}
    update_cache: yes
