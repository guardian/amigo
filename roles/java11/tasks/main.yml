---
- name: Install Java 11 JRE and JDK
  apt:
    name:
    - openjdk-11-jdk
    state: latest
  when: ansible_os_family == "Debian"

## Block compromised emudhra certificates
- name: Find installed OpenJDK 11 JVMs
  find:
    paths: /usr/lib/jvm
    patterns: "java-11-openjdk-*"
    file_type: directory
    recurse: no
  register: openjdk11_homes
  when: ansible_os_family == "Debian"

- name: Append emudhra certs to JVM blocked certificate config
  blockinfile:
    path: "{{ item }}/lib/security/blocked.certs"
    block: "{{ lookup('file', 'emudhra.certs') }}"
    create: yes
  loop: "{{ openjdk11_homes.files | map(attribute='path') | list }}"
  when: ansible_os_family == "Debian"

## This modifies the JVM's DNS cache TTL, changing it from the default of INFINITY to 60
## seconds. See this issue for full details: https://github.com/guardian/amigo/issues/238
- name: Change JVM DNS cache TTL
  replace:
    path: /etc/java-11-openjdk/security/java.security
    regexp: '#networkaddress.cache.ttl=.*'
    replace: 'networkaddress.cache.ttl=60'
    backup: yes
  when: ansible_os_family == "Debian"

