---
# NOTE: this package is not signature-verified. AWS only sign it with dpkg-sig (unsupported by
# apt/dpkg, and absent from modern Debian/Ubuntu) and publish no apt repository or versioned URL.
# See https://github.com/aws-observability/aws-otel-collector/issues/3240 for request for updated
# verification mechanism
- name: Install latest otel collector package
  apt: deb=https://aws-otel-collector.s3.amazonaws.com/ubuntu/arm64/latest/aws-otel-collector.deb state=present

- name: Remove default otel configuration file
  file:
    state: absent
    path: /opt/aws/aws-otel-collector/etc/config.yaml
