---
- name: Add Elastic repository
  ansible.builtin.deb822_repository:
    name: elastic
    types: deb
    uris: "https://artifacts.elastic.co/packages/{{ version.split('.')[0] }}.x/apt"
    suites: stable
    components: main
    signed_by: https://artifacts.elastic.co/GPG-KEY-elasticsearch
    state: present

- name: Ensure elasticsearch is installed
  apt:
    name: "elasticsearch={{ version }}"
    update_cache: true
    state: present

- name: Ensure proper limits for elasticsearch user
  blockinfile:
    dest: /etc/security/limits.conf
    block: |
      {{ es_user }} - nofile  655
      {{ es_user }} - memlock unlimited

- name: Install elasticsearch plugins
  command: "{{ es_home }}/bin/elasticsearch-plugin install {{ item }} --batch --silent"
  with_items: "{{ plugins | default([]) }}"
