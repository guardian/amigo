---
- name: Add AWS Corretto repo
  ansible.builtin.deb822_repository:
    name: corretto
    types: deb
    uris: https://apt.corretto.aws
    suites: stable
    components: main
    signed_by: https://apt.corretto.aws/corretto.key
    state: present

- name: Install Java 25 Corretto JDK
  apt:
    name:
      - java-25-amazon-corretto-jdk
    state: latest
    update_cache: true
  when: ansible_os_family == "Debian"

## This modifies the JVM's DNS cache TTL, changing it from the default of INFINITY to 60
## seconds. See this issue for full details: https://github.com/guardian/amigo/issues/238
- name: Change JVM DNS cache TTL
  replace:
    path: /usr/lib/jvm/java-25-amazon-corretto/conf/security/java.security
    regexp: "#networkaddress.cache.ttl=.*"
    replace: "networkaddress.cache.ttl=60"
    backup: yes
  when: ansible_os_family == "Debian"
