---
- name: Fail when no Fluent Bit repository is configured for this Ubuntu release
  fail:
    msg: No Fluent Bit repository configured for Ubuntu {{ ansible_distribution_version }} (please add one)!
  when: ansible_distribution == 'Ubuntu' and ansible_distribution_major_version|int > 22 and ansible_distribution_version not in ['24.04', '26.04']

- name: Setup target directory
  file:
    path: /var/lib/cloud/scripts/per-instance
    state: directory
  when:
    - ansible_os_family == "Debian"

- name: Install instance-tag-discovery
  shell: |
    NAME=instance-tag-discovery
    /usr/local/bin/aws s3 cp s3://{{ dist_bucket }}/deploy/PROD/$NAME/$NAME-linux-{{ deb_arch }} /var/lib/cloud/scripts/per-instance/00-$NAME
    chmod +x /var/lib/cloud/scripts/per-instance/00-$NAME
  when:
    - ansible_os_family == "Debian"

- name: Install devx-logs
  shell: |
    NAME=devx-logs
    /usr/local/bin/aws s3 cp s3://{{ dist_bucket }}/deploy/CODE/$NAME/$NAME-linux-{{ deb_arch }} /var/lib/cloud/scripts/per-instance/01-$NAME
    chmod +x /var/lib/cloud/scripts/per-instance/01-$NAME
  when:
    - ansible_os_family == "Debian"

# Note, this is required to ensure we start Fluentbit *after* updating the config.
- name: Add start Fluentbit script
  copy:
    dest: /var/lib/cloud/scripts/per-instance/02-start-fluentbit
    mode: '0755'
    content: |
      #!/bin/bash
      if [ -f /etc/fluent-bit/fluent-bit.conf ]; then
        systemctl start fluent-bit.service
      elif [ -f /etc/td-agent-bit/td-agent-bit.conf ]; then
        systemctl start td-agent-bit.service
      else
        echo 'No Fluent Bit configuration found' >&2
        exit 1
      fi
  when:
    - ansible_os_family == "Debian"
    - start_fluentbit

- name: Remove syslog output
  shell: |
    NAME=remove-syslog-output
    sudo sh -c 'echo ForwardToSyslog=no >> /etc/systemd/journald.conf'
    sudo systemctl force-reload systemd-journald
  when:
    - ansible_os_family == "Debian"
