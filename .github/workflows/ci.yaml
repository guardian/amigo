name: CI
on:
  pull_request:
    branches-ignore:
      - dependency-updates
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  E2E:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          cache: 'npm'
          node-version-file: '.tool-versions'
      - uses: guardian/setup-scala@v2
      - run: npm ci
      - run: npm run typecheck:e2e && npm run test:e2e:mock
      - name: Read installed Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --workers=2
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: google-mocked-e2e-results
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  CI:
    runs-on: ubuntu-latest
    permissions:
      contents: read

      # These permissions are required by guardian/actions-riff-raff...
      id-token: write # ...to exchange an OIDC JWT ID token for AWS credentials
      pull-requests: write #...to comment on PRs
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7 # This is required by cdk
        with:
          cache: 'npm'
          cache-dependency-path: 'cdk/package-lock.json'
          node-version-file: '.tool-versions'
      - uses: guardian/setup-scala@v2
      - name: Seed build number from TeamCity
        run: |
          LAST_TEAMCITY_BUILD=3006
          echo BUILD_NUMBER=$(( $GITHUB_RUN_NUMBER + $LAST_TEAMCITY_BUILD )) >> $GITHUB_ENV
      - run: ./script/ci
      - uses: guardian/actions-riff-raff@v4
        with:
          projectName: tools::amigo
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          buildNumber: ${{ env.BUILD_NUMBER }}
          configPath: riff-raff.yaml
          contentDirectories: |
            cloudformation:
              - cdk/cdk.out/AMIgo-CODE.template.json
              - cdk/cdk.out/AMIgo-PROD.template.json
            amigo:
              - target/amigo_1.0-latest_all.deb
            imagecopier:
              - imageCopier/target/universal/image-copier.zip
