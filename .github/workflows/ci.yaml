name: CI
on:
  pull_request:
    branches-ignore:
      - dependency-updates
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  E2E:
    name: E2E testing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.tool-versions'
          cache: 'npm'

      - uses: guardian/setup-scala@v1

      - name: Install npm dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps --only-shell chromium

      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          AMIGO_E2E_SERVER: 'true'

  CI:
    runs-on: ubuntu-latest
    permissions:
      contents: read

      # These permissions are required by guardian/actions-riff-raff...
      id-token: write # ...to exchange an OIDC JWT ID token for AWS credentials
      pull-requests: write #...to comment on PRs
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7 # This is required by cdk
        with:
          cache: 'npm'
          cache-dependency-path: 'cdk/package-lock.json'
          node-version-file: '.tool-versions'
      - uses: guardian/setup-scala@v2
      - name: Seed build number from TeamCity
        run: |
          LAST_TEAMCITY_BUILD=3006
          echo BUILD_NUMBER=$(( $GITHUB_RUN_NUMBER + $LAST_TEAMCITY_BUILD )) >> $GITHUB_ENV
      - run: ./script/ci
      - uses: guardian/actions-riff-raff@v4
        with:
          projectName: tools::amigo
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          roleArn: ${{ secrets.GU_RIFF_RAFF_ROLE_ARN }}
          buildNumber: ${{ env.BUILD_NUMBER }}
          configPath: riff-raff.yaml
          contentDirectories: |
            cloudformation:
              - cdk/cdk.out/AMIgo-CODE.template.json
              - cdk/cdk.out/AMIgo-PROD.template.json
            amigo:
              - target/amigo_1.0-latest_all.deb
            imagecopier:
              - imageCopier/target/universal/image-copier.zip
