name: amigo-e2e

services:
  aws:
    # 4.14.0 is the last open-source community release; later tags require an auth token.
    image: localstack/localstack:4.14.0
    ports:
      - 127.0.0.1:4566:4566
    environment:
      SERVICES: ssm,dynamodb,sts,ec2,sns,s3
    volumes:
      - ./seed.sh:/etc/localstack/init/ready.d/seed.sh:ro
    healthcheck:
      # Healthy only once seed.sh has run successfully.
      test: [CMD-SHELL, "curl -fs http://localhost:4566/_localstack/init/ready | grep -Eq '\"state\": ?\"SUCCESSFUL\"'"]
      interval: 1s
      retries: 60

  oauth:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.4
    ports:
      - 127.0.0.1:8090:8080
    environment:
      JSON_CONFIG_PATH: /config/oauth.json
    volumes:
      - ./oauth.json:/config/oauth.json:ro

  prism:
    image: wiremock/wiremock:3.13.2
    ports:
      - 127.0.0.1:8091:8080
    volumes:
      - ./prism:/home/wiremock/mappings:ro
