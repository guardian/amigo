stacks:
- deploy
regions:
- eu-west-1
deployments:
  cloudformation:
    type: cloud-formation
    app: amigo
    parameters:
      templateStagePaths:
        CODE: AMIgo-CODE.template.json
        PROD: AMIgo-PROD.template.json
  # upload lambda
  imagecopier:
    type: aws-s3
    parameters:
      cacheControl: public, max-age=600
      publicReadAcl: false
